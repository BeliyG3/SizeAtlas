[package]
name = "sizeatlas"
version = "2026.10.4"
edition = "2024"
license = "MIT"
description = "SizeAtlas desktop app"
publish = false

[lib]
name = "sizeatlas_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
sizeatlas-core = { path = "../core" }
dunce = "1.0"
serde = { version = "1.0", features = ["derive"] }
sysinfo = { version = "0.38", default-features = false, features = ["disk", "system"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tokio = { version = "1", features = ["sync"] }
trash = "=5.2.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_NetworkManagement_WNet",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
