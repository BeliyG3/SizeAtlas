name: Release

# Push a tag `v` + the shown version (`v2026.10`, `v2026.10.1`) to build the installers
# into a draft GitHub Release. See "Releases" in the README.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      display: ${{ steps.version.outputs.display }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          # The same rules as the app: node runs the TypeScript module directly.
          rules="import { displayVersion, wixVersion } from './src/features/menubar/version.ts'"
          display=$(node --input-type=module -e "$rules; console.log(displayVersion(process.argv[1]))" "$version")
          wix=$(node --input-type=module -e "$rules; console.log(wixVersion(process.argv[1]))" "$version")
          windows_wix=$(node -p "require('./src-tauri/tauri.windows.conf.json').bundle.windows.wix.version")
          tag="${GITHUB_REF_NAME#v}"
          fail() { echo "::error::$1"; exit 1; }
          [[ "$version" =~ ^[0-9]{4}\.(1[0-2]|[1-9])\.(0|[1-9][0-9]*)$ ]] || fail "package.json version $version is not YEAR.MONTH.N"
          [[ "$tag" =~ ^[0-9]{4}\.(1[0-2]|[1-9])(\.[1-9][0-9]*)?$ ]] || fail "tag $GITHUB_REF_NAME is not vYEAR.MONTH or vYEAR.MONTH.N"
          [[ "$tag" == "$display" ]] || fail "tag $GITHUB_REF_NAME does not match package.json version $version (expected v$display)"
          for manifest in core/Cargo.toml src-tauri/Cargo.toml; do
            grep -qx "version = \"$version\"" "$manifest" || fail "$manifest does not have version $version"
          done
          # MSI allows at most 255 in the major version, so the Windows config holds YY.MM.N.
          [[ "$windows_wix" == "$wix" ]] || fail "src-tauri/tauri.windows.conf.json has MSI version $windows_wix, expected $wix"
          {
            echo "version=$version"
            echo "display=$display"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos-arm64
            target: aarch64-apple-darwin
          - os: macos-latest
            name: macos-x64
            target: x86_64-apple-darwin
          # The oldest available Ubuntu, so the AppImage runs on systems with an older glibc.
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: rustup toolchain install
      - if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Build the installers
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [[ -n "$TARGET" ]]; then args+=(--target "$TARGET"); fi
          if [[ "$RUNNER_OS" == Linux ]]; then args+=(--bundles appimage,deb); fi
          npm run tauri build -- "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/deb/*.deb

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
          DISPLAY_VERSION: ${{ needs.check.outputs.display }}
          NOTES: |
            Installers for Windows, macOS and Linux. They are not signed: see how to install them in the [README](${{ github.server_url }}/${{ github.repository }}#install).
        run: |
          # File names carry the shown version: SizeAtlas_2026.10_x64-setup.exe, not _2026.10.0_.
          mkdir installers
          find artifacts -type f -print0 | while IFS= read -r -d '' file; do
            name=$(basename "$file")
            mv "$file" "installers/${name//_${VERSION}_/_${DISPLAY_VERSION}_}"
          done
          ls -l installers
          gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "SizeAtlas $DISPLAY_VERSION" --notes "$NOTES"
